<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Resume Creator — Word Style Editor</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">R</div><div><h1>Resume Creator</h1><p>Build • Customize • Print your professional resume</p></div></div>
  <div class="actions"><button id="saveBtn" class="secondary">💾 Save</button><button id="clearBtn" class="secondary">Clear</button><button id="printBtn" class="primary">🖨 Download PDF</button></div>
</header>
<div class="toolbar">
  <label>Template<select id="template"><option value="classic">Classic</option><option value="modern">Modern</option><option value="minimal">Minimal</option><option value="creative">Creative</option><option value="executive">Executive</option><option value="academic">Academic</option></select></label>
  <label>Font<select id="font"><option>Arial</option><option>Calibri</option><option>Georgia</option><option>Garamond</option><option>Trebuchet MS</option><option>Times New Roman</option><option>Verdana</option></select></label>
  <label>Accent <input id="accent" type="color" value="#2563eb"></label>
  <label>Text <input id="textColor" type="color" value="#172033"></label>
  <label>Body <input id="bodySize" type="range" min="9" max="13" value="11"><span id="bodySizeVal">11px</span></label>
  <label>Spacing <input id="spacing" type="range" min="1" max="2" step=".1" value="1.5"><span id="spacingVal">1.5</span></label>
  <label>Margins<select id="margins"><option value="compact">Compact</option><option value="normal" selected>Normal</option><option value="wide">Wide</option></select></label>
  <button id="photoBtn" class="toolbtn">📷 Add Photo</button><input id="photo" type="file" accept="image/*" hidden>
</div>
<main class="app">
<section class="panel editor">
<h2>Resume Content</h2>
<div class="section"><h3>Personal Information</h3><div class="grid">
<label>Full Name<input id="name" placeholder="Your Name"></label><label>Professional Title<input id="title" placeholder="AI & Data Science Student"></label>
<label>Email<input id="email" type="email" placeholder="you@example.com"></label><label>Phone<input id="phone" placeholder="+91 98765 43210"></label>
<label>Location<input id="location" placeholder="Coimbatore, Tamil Nadu"></label><label>LinkedIn<input id="linkedin" placeholder="linkedin.com/in/yourname"></label>
<label>GitHub<input id="github" placeholder="github.com/yourname"></label><label>Portfolio<input id="portfolio" placeholder="yourportfolio.com"></label>
</div><label>Professional Summary<textarea id="summary" rows="4" placeholder="2–4 lines describing your profile, strengths and career direction"></textarea></label></div>
<div class="section"><h3>Education</h3><div id="educationList"></div><button class="add" data-add="education">+ Add Education</button></div>
<div class="section"><h3>Skills</h3><div class="grid"><label>Technical Skills<input id="skills" placeholder="Python, Java, SQL, HTML, CSS, JavaScript"></label><label>Tools & Technologies<input id="tools" placeholder="GitHub, VS Code, Jupyter, MongoDB"></label><label>Soft Skills<input id="softSkills" placeholder="Communication, Teamwork, Leadership"></label><label>Languages<input id="languages" placeholder="English, Tamil, Hindi"></label></div></div>
<div class="section"><h3>Projects</h3><div id="projectList"></div><button class="add" data-add="project">+ Add Project</button></div>
<div class="section"><h3>Experience / Internship</h3><div id="experienceList"></div><button class="add" data-add="experience">+ Add Experience</button></div>
<div class="section"><h3>Certifications</h3><div id="certificationList"></div><button class="add" data-add="certification">+ Add Certification</button></div>
<div class="section"><h3>Achievements & Activities</h3><textarea id="achievements" rows="5" placeholder="One achievement, workshop, hackathon or activity per line"></textarea></div>
<div class="section"><h3>Additional Details</h3><div class="grid"><label>Career Objective<textarea id="objective" rows="3" placeholder="Optional career objective"></textarea></label><label>Hobbies / Interests<textarea id="interests" rows="3" placeholder="AI, reading, photography"></textarea></label><label>Publications / Papers<textarea id="publications" rows="3" placeholder="Optional publications or paper presentations"></textarea></label><label>Declaration<textarea id="declaration" rows="3" placeholder="Optional declaration"></textarea></label></div></div>
</section>
<section class="panel preview-wrap"><div class="preview-head"><h2>Live A4 Preview</h2><span id="status">Ready</span></div><article id="resumePreview" class="resume" contenteditable="false"></article></section>
</main>
<script src="script.js"></script>
</body></html>
